<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Generador de Iconos - Biblioteca de Promps</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 2rem; background: #0a1628; color: white; text-align: center; }
    canvas { border: 2px solid #37474f; margin: 1rem; border-radius: 16px; }
    button { padding: 1rem 2rem; background: #1a73e8; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; margin: 0.5rem; }
    button:hover { background: #1557b0; }
    h1 { margin-bottom: 2rem; }
    .container { max-width: 800px; margin: 0 auto; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏭 Generador de Iconos PWA</h1>
    <p>Haz clic en los botones para generar y descargar los iconos</p>
    
    <div>
      <canvas id="canvas192" width="192" height="192"></canvas>
      <canvas id="canvas512" width="512" height="512"></canvas>
    </div>
    
    <div>
      <button onclick="generateIcon(192)">Generar Icono 192x192</button>
      <button onclick="generateIcon(512)">Generar Icono 512x512</button>
      <button onclick="generateAll()">Generar Todos</button>
    </div>
    
    <p style="margin-top: 2rem; color: #78909c;">
      Los iconos se descargarán automáticamente a tu carpeta de descargas
    </p>
  </div>

  <script>
    function generateIcon(size) {
      const canvas = document.getElementById(`canvas${size}`);
      const ctx = canvas.getContext('2d');
      
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#1a73e8');
      gradient.addColorStop(1, '#1557b0');
      
      ctx.fillStyle = gradient;
      ctx.beginPath();
      const radius = size * 0.167;
      ctx.moveTo(radius, 0);
      ctx.lineTo(size - radius, 0);
      ctx.quadraticCurveTo(size, 0, size, radius);
      ctx.lineTo(size, size - radius);
      ctx.quadraticCurveTo(size, size, size - radius, size);
      ctx.lineTo(radius, size);
      ctx.quadraticCurveTo(0, size, 0, size - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();
      ctx.fill();
      
      ctx.font = `${size * 0.35}px Arial`;
      ctx.textAlign = 'center';
      ctx.fillStyle = 'white';
      ctx.fillText('🏭', size / 2, size * 0.45);
      
      ctx.font = `bold ${size * 0.14}px Arial`;
      ctx.fillText('PROMPS', size / 2, size * 0.72);
      
      ctx.font = `${size * 0.08}px Arial`;
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.fillText('INDUSTRIAL', size / 2, size * 0.86);
      
      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `icon-${size}.png`;
        a.click();
        URL.revokeObjectURL(url);
      });
    }
    
    function generateAll() {
      generateIcon(192);
      setTimeout(() => generateIcon(512), 500);
    }
    
    window.onload = () => {
      generateIcon(192);
      generateIcon(512);
    };
  </script>
</body>
</html>

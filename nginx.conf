worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 1024;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ---- Brotli & Gzip ----
  brotli on;
  brotli_comp_level 6;
  brotli_static on;
  brotli_types text/plain text/html text/css application/javascript application/json
               image/svg+xml application/xml text/xml text/markdown;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # ---- Security ----
  server_tokens off;
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header X-XSS-Protection "1; mode=block";
  add_header Referrer-Policy strict-origin-when-cross-origin;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()";

  # ---- Performance ----
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  # ---- Cache static assets ----
  map $request_uri $cache_control {
    ~*\.(js|css|svg|png|webp|ico|woff2)$ "public, max-age=31536000, immutable";
    ~*\.html$                       "public, max-age=3600, must-revalidate";
    default                         "public, max-age=86400";
  }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://api.openai.com https://api.anthropic.com https://api.groq.com https://api.deepseek.com https://openrouter.ai https://dashscope-intl.aliyuncs.com https://generativelanguage.googleapis.com http://localhost:*; font-src 'self' https://fonts.gstatic.com data:; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # Cache-Control
    add_header Cache-Control $cache_control;

    # SPA fallback: all routes serve index.html
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Deny hidden files
    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
    }

    # Static assets with Brotli precompressed
    location ~* \.(js|css|svg|png|html|json|md)$ {
      brotli_static on;
      gzip_static on;
      expires 1y;
      add_header Cache-Control $cache_control;
      add_header Vary Accept-Encoding;
    }
  }
}